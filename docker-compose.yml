services:
  db:
    image: postgres:18-alpine
    container_name: mon-sinistre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # C postgres:18 том монтируется в /var/lib/postgresql (PGDATA — в
      # подкаталоге версии); старый путь /var/lib/postgresql/data оставил бы
      # данные вне тома.
      - mon-sinistre-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mon-sinistre-db-data:
